name: Twice Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twice-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.daemon=true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java with Gradle dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/settings.gradle
            android/settings.gradle.kts

      - name: Set up cached Flutter SDK and packages
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Cache Dart package downloads
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Patch legacy video_thumbnail Android build script
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          path = (
              Path.home()
              / ".pub-cache/hosted/pub.dev/video_thumbnail-0.5.6/android/build.gradle"
          )
          if not path.is_file():
              raise SystemExit(f"Plugin Gradle file not found: {path}")

          text = path.read_text()

          # Remove the obsolete nested AGP 4.1.0 buildscript block.
          patched, count = re.subn(
              r"(?ms)^buildscript\s*\{.*?^\}\s*\n",
              "",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected legacy buildscript block not found.")

          # Gradle 9 no longer provides jcenter().
          patched = re.sub(r"(?m)^\s*jcenter\(\)\s*\n", "", patched)

          if "jcenter()" in patched or "com.android.library" not in patched:
              raise SystemExit("Plugin patch validation failed.")

          path.write_text(patched)
          print("Patched video_thumbnail 0.5.6 for the CI Gradle setup.")
          PYTHON


      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358

      - name: Cache native CMake build intermediates
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/.cxx
          key: ${{ runner.os }}-twice-native-${{ hashFiles('android/app/src/main/cpp/**', 'android/app/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-twice-native-

      - name: Verify Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is empty or unavailable"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is empty or unavailable"; exit 1; }
          test -n "$GOOGLE_SERVER_CLIENT_ID" || { echo "::error::GOOGLE_SERVER_CLIENT_ID secret is empty or unavailable"; exit 1; }
          case "$SUPABASE_URL" in
            https://*.supabase.co) echo "Supabase URL format looks valid." ;;
            *) echo "::error::SUPABASE_URL format is invalid"; exit 1 ;;
          esac
          echo "Supabase and Google configuration values are present."

      - name: Verify Supabase project ref
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PROJECT_REF: jgqxvqlwnfywzoxbfkpk
        run: |
          ACTUAL_REF="${SUPABASE_URL#https://}"
          ACTUAL_REF="${ACTUAL_REF%.supabase.co}"
          if [ "$ACTUAL_REF" = "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase project ref: MATCH"
          else
            echo "::error::Supabase project ref: MISMATCH"
            exit 1
          fi

      - name: Build ARM64 release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >-
          flutter build apk --release --target-platform android-arm64
          --split-per-abi --no-pub
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY
          --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twice-ARM64-Release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify Dart code and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up cached Flutter SDK and packages
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Cache Dart package downloads
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run widget tests
        run: flutter test --no-pub
