name: Twice Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twice-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.caching=true
        -Dorg.gradle.parallel=true
        -Dorg.gradle.daemon=true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java with Gradle dependency cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/settings.gradle
            android/settings.gradle.kts

      - name: Set up cached Flutter SDK and packages
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Cache Dart package downloads
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          key: ${{ runner.os }}-android-ndk-28.2.13676358

      - name: Cache native CMake build intermediates
        uses: actions/cache@v4
        with:
          path: |
            android/app/.cxx
            android/.cxx
          key: ${{ runner.os }}-twice-native-${{ hashFiles('android/app/src/main/cpp/**', 'android/app/build.gradle.kts', 'android/settings.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-twice-native-

      - name: Verify Supabase build configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is empty or unavailable"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is empty or unavailable"; exit 1; }
          case "$SUPABASE_URL" in
            https://*.supabase.co) echo "Supabase URL format looks valid." ;;
            *) echo "::error::SUPABASE_URL format is invalid"; exit 1 ;;
          esac
          echo "Both Supabase configuration values are present."

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --no-pub --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Twice-ARM64-Release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify Dart code and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up cached Flutter SDK and packages
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Cache Dart package downloads
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-

      - name: Resolve Dart dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run widget tests
        run: flutter test --no-pub
